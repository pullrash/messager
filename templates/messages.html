<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Повідомлення — Месенджер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Messenger</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="{{ url_for('index') }}">Головна</a>
                    <a class="nav-link" href="{{ url_for('friends') }}">Друзі</a>
                    <a class="nav-link" href="{{ url_for('search_friends') }}">Пошук</a>
                    <a class="nav-link" href="{{ url_for('friends_requests') }}">Заявки</a>
                    <a class="nav-link active" href="{{ url_for('messages') }}">Повідомлення</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 650px;">
        <h3 class="mb-3">Вхідні непрочитані</h3>

        <!-- Вивід списку непрочитаних повідомлень із словника message_dict -->
        {% if message_dict %}
            {% for sender, text in message_dict.items() %}
                <div class="card mb-3 shadow-sm border-0">
                    <div class="card-header bg-white font-weight-bold">
                        Від: <strong>{{ sender }}</strong>
                    </div>
                    <div class="card-body">
                        <p class="card-text">{{ text }}</p>
                        <a href="{{ url_for('message', name=sender) }}" class="btn btn-sm btn-primary">Відповісти</a>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <div class="alert alert-light border" role="alert">
                Непрочитаних повідомлень немає.
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
