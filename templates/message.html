<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Написати — Месенджер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Messenger</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="{{ url_for('index') }}">Головна</a>
                    <a class="nav-link" href="{{ url_for('friends') }}">Друзі</a>
                    <a class="nav-link" href="{{ url_for('search_friends') }}">Пошук</a>
                    <a class="nav-link" href="{{ url_for('friends_requests') }}">Заявки</a>
                    <a class="nav-link" href="{{ url_for('messages') }}">Повідомлення</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 650px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title mb-3">Нове повідомлення</h4>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Текст повідомлення</label>
                        <textarea name="text" class="form-control" rows="4" placeholder="Напишіть щось..." required></textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('friends') }}" class="btn btn-outline-secondary">← Назад</a>
                        <button type="submit" class="btn btn-primary">Надіслати</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
