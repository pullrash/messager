<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — Месенджер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 450px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Створити акаунт</h3>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Придумайте логін</label>
                        <input type="text" name="username" class="form-control" placeholder="Наприклад, alex_dev" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Придумайте пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="Мін. 6 символів" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Зареєструватися</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Вже є акаунт? <a href="{{ url_for('login') }}">Увійти</a></small>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
