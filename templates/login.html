<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Месенджер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 450px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Авторизація</h3>

                <!-- Блок для виводу помилки входу -->
                {% if error %}
                    <div class="alert alert-danger" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Логін</label>
                        <input type="text" name="username" class="form-control" placeholder="Введіть ваш логін" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="Введіть пароль" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Увійти</button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">Ще немає акаунту? <a href="{{ url_for('register') }}">Зареєструватися</a></small>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
