<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої друзі — Месенджер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Messenger</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="{{ url_for('index') }}">Головна</a>
                    <a class="nav-link active" href="{{ url_for('friends') }}">Друзі</a>
                    <a class="nav-link" href="{{ url_for('search_friends') }}">Пошук</a>
                    <a class="nav-link" href="{{ url_for('friends_requests') }}">Заявки</a>
                    <a class="nav-link" href="{{ url_for('messages') }}">Повідомлення</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 650px;">
        <h3 class="mb-3">Ваші друзі</h3>

        {% if friends %}
            <div class="list-group shadow-sm border-0">
                {% for name in friends %}
                    <div class="list-group-item d-flex justify-content-between align-items-center p-3">
                        <span class="fw-bold">{{ name }}</span>
                        <!-- Посилання відкриває форму чату з цим користувачем -->
                        <a href="{{ url_for('message', name=name) }}" class="btn btn-outline-primary btn-sm">
                            💬 Написати
                        </a>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-secondary" role="alert">
                У вас поки немає друзів. Скористайтеся розділом <a href="{{ url_for('search_friends') }}" class="alert-link">Пошук</a>.
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
